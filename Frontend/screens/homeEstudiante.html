<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EscuelaApp🎓</title>
    <link rel="stylesheet" href="../styles/HeadAndFoot.css">
    <link rel="stylesheet" href="../styles/homeEstudiante.css">
</head>
<body>
    <header>
        <div id="headerlogo">
            <button id="boton_atras_home" onclick="cerrarsesion()">
                <img src="../Assets/luzh47ih_400x400.png" alt="" class="logo_colegio">
            </button>
            <h1>EscuelaApp</h1>
        </div>
        <div>
            <h2 id="username"></h2>
        </div>
    </header>

    <section>
        <form style="display: flex; flex-direction: row;" id="boton-filtro">
            <input class="inputbuscar" id="inputSalon" type="text" placeholder="Nombre del Salón">
            <input class="inputbuscar" id="inputContrasena" type="text" placeholder="Contraseña">
            <input class="botonbuscar" type="button" value="Matricularse">
        </form>
        
        <div class="wrapper">
            <p>Cargando tus materias...</p>
        </div>
    </section>

    <div class="contenedor-apps-globales">
        <button
            id="my-button"
            class="boton-apps-globales"
            type="button"
            aria-label="Mostrar aplicaciones"
            aria-expanded="false"
            aria-controls="my-list"
            title="Aplicaciones"
        >
            <span class="rejilla-apps-globales" aria-hidden="true">
                <span class="punto-app-global punto-rojo-global"></span>
                <span class="punto-app-global punto-amarillo-global"></span>
                <span class="punto-app-global punto-verde-global"></span>
                <span class="punto-app-global punto-amarillo-global"></span>
                <span class="punto-app-global punto-verde-global"></span>
                <span class="punto-app-global punto-azul-global"></span>
                <span class="punto-app-global punto-verde-global"></span>
                <span class="punto-app-global punto-azul-global"></span>
                <span class="punto-app-global punto-morado-global"></span>
            </span>
        </button>

        <div
            id="my-list"
            class="panel-apps-globales"
            aria-labelledby="titulo-apps-globales"
            hidden
        >
            <div class="encabezado-apps-globales">
                <div>
                    <p class="etiqueta-apps-globales">Recursos digitales</p>
                    <h2 id="titulo-apps-globales">Aplicaciones</h2>
                </div>

                <button
                    id="cerrar-apps-globales"
                    class="cerrar-apps-globales"
                    type="button"
                    aria-label="Cerrar aplicaciones"
                    title="Cerrar"
                >&times;</button>
            </div>

            <div
                id="lista-apps-globales"
                class="lista-apps-globales"
                aria-live="polite"
            >
                <p class="mensaje-apps-globales">Cargando aplicaciones...</p>
            </div>
        </div>
    </div>

    <footer>
        <h2>CONTÁCTENOS</h2>
        <h2>Avenida Universidad Tecnológica de Panamá,
            Vía Puente Centenario, Campus Metropolitano
            Dr. Víctor Levi Sasso, Edificio No. 3, tercer piso.</h2>
        <h2>Teléfono: (507) 317-2000</h2>
    </footer>
    <script src="../middleware/mostrarApps.js"></script>
    <script src="../styles/boton.js"></script>
    <script src="../middleware/pantallaprincipal.js"></script>
    <script src="../middleware/matricularse.js"></script>
    <script src="../middleware/obtenersalonesestudiante.js"></script>
</body>
</html>
